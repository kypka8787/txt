<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt & Text Hub | Быстрая работа с текстом и промтами</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(23, 30, 48, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
    }

    header {
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      background: rgba(11, 15, 25, 0.6);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .logo-badge {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px;
      display: grid;
      gap: 28px;
    }

    .hero {
      text-align: center;
      margin-bottom: 8px;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stats {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stat-item strong {
      color: var(--text-main);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      font-family: inherit;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--card-border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .editor-wrapper {
      position: relative;
    }

    textarea {
      width: 100%;
      height: 280px;
      background: rgba(11, 15, 25, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 18px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .quick-templates {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .template-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .template-chip:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--accent);
      color: #c7d2fe;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      margin-top: auto;
    }

    footer a {
      color: #818cf8;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-badge">TXT</div>
      <span>Prompt & Text Cloud</span>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      Сайт работает онлайн
    </div>
  </header>

  <main>
    <div class="hero">
      <h1>Ваш персональный текстовый хаб</h1>
      <p>Редактируйте, сохраняйте и копируйте ваши промты и заметки мгновенно</p>
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="stats">
          <div class="stat-item">Символов: <strong id="charCount">0</strong></div>
          <div class="stat-item">Слов: <strong id="wordCount">0</strong></div>
          <div class="stat-item">Строк: <strong id="lineCount">0</strong></div>
        </div>

        <div class="actions">
          <button class="btn-secondary" id="clearBtn" title="Очистить">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            Очистить
          </button>
          <button class="btn-secondary" id="saveBtn" title="Сохранить в браузере">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
            Сохранить
          </button>
          <button class="btn-primary" id="copyBtn">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            Скопировать
          </button>
        </div>
      </div>

      <div class="editor-wrapper">
        <textarea id="editor" placeholder="Сюда вставьте ваш промт или текст...">Сюда вставьте ваш промт или текст</textarea>
      </div>

      <div class="quick-templates">
        <span style="font-size: 0.8rem; color: var(--text-muted); align-self: center; margin-right: 4px;">Шаблоны:</span>
        <div class="template-chip" data-template="Действуй как опытный Fullstack разработчик. Напиши чистый, оптимизированный и безопасный код для следующей задачи: ">💻 Кодинг промт</div>
        <div class="template-chip" data-template="Сделай краткую выжимку (summary) следующего текста с выделением ключевых тезисов и выводов: ">📑 Суммаризация</div>
        <div class="template-chip" data-template="Проверь данный текст на грамматические и пунктуационные ошибки, улучши стиль и сделай его более убедительным: ">✍️ Редактор текста</div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
    <span id="toastMsg">Скопировано в буфер!</span>
  </div>

  <footer>
    <p>Развернуто через репозиторий <a href="https://github.com/kypka8787/txt" target="_blank">kypka8787/txt</a></p>
  </footer>

  <script>
    const editor = document.getElementById('editor');
    const charCount = document.getElementById('charCount');
    const wordCount = document.getElementById('wordCount');
    const lineCount = document.getElementById('lineCount');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    function updateStats() {
      const text = editor.value;
      charCount.textContent = text.length;
      const words = text.trim().split(/\s+/).filter(Boolean);
      wordCount.textContent = text.trim() ? words.length : 0;
      lineCount.textContent = text ? text.split('\n').length : 0;
    }

    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Load saved prompt if available
    const saved = localStorage.getItem('user_prompt');
    if (saved) {
      editor.value = saved;
    }
    updateStats();

    editor.addEventListener('input', () => {
      updateStats();
      localStorage.setItem('user_prompt', editor.value);
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(editor.value);
        showToast('Текст успешно скопирован!');
      } catch (err) {
        editor.select();
        document.execCommand('copy');
        showToast('Скопировано!');
      }
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('Очистить поле ввода?')) {
        editor.value = '';
        localStorage.removeItem('user_prompt');
        updateStats();
        showToast('Очищено');
      }
    });

    saveBtn.addEventListener('click', () => {
      localStorage.setItem('user_prompt', editor.value);
      showToast('Сохранено локально!');
    });

    document.querySelectorAll('.template-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        editor.value = chip.getAttribute('data-template');
        updateStats();
        editor.focus();
        showToast('Шаблон применен!');
      });
    });
  </script>
</body>
</html>
